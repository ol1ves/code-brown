[project]
name = "groogled"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API / web
    "anthropic>=0.50",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "starlette>=0.36",
    # data / HTTP
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    # database
    "supabase>=2.0",
    # browser automation
    "patchright>=0.1",
    # CLI / output
    "click>=8.1",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "scraper*", "xscraper*", "ev*", "shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scraper/tests", "tests", "xscraper/tests"]
